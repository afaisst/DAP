<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily AstroPH Profile</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/theme.js"></script>
  </head>
  <body>
    <main class="app-shell admin-shell">
      <section class="topbar" aria-label="Profile controls">
        <div class="admin-toolbar">
          <div>
            <p class="eyebrow">user profile</p>
            <h1>Profile</h1>
          </div>
          <div class="admin-toolbar-actions">
          <button class="icon-btn theme-toggle" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg class="icon-moon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M16.5 12.2A6.8 6.8 0 0 1 7.8 3.5a6.8 6.8 0 1 0 8.7 8.7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <svg class="icon-sun" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M4.7 15.3L6 14M14 6l1.3-1.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
            <a class="admin-back-link" href="/">Back to Daily AstroPH</a>
          </div>
        </div>
        <div id="profileStatus" class="auth-status">Loading profile...</div>
      </section>

      <section class="profile-grid" aria-live="polite">
        <article class="profile-card">
          <h2>Author details</h2>
          <label class="profile-field">
            <span>Full name</span>
            <input id="fullNameInput" type="text" autocomplete="name" placeholder="Full name">
          </label>
          <label class="profile-field">
            <span>ORCID</span>
            <input id="orcidInput" type="text" autocomplete="off" placeholder="0000-0000-0000-0000">
          </label>
          <div class="profile-actions">
            <button id="saveProfileButton" type="button">Save profile</button>
          </div>
        </article>

        <article class="profile-card">
          <h2>My Paper Settings</h2>
          <p class="profile-help">Add the name variants that should count as you in My Papers.</p>
          <div id="nameAliasesList" class="name-aliases-list"></div>
          <div class="profile-actions">
            <button id="addNameAliasButton" type="button" class="secondary-button">+ Add name</button>
          </div>
        </article>

        <article class="profile-card">
          <h2>Password</h2>
          <label class="profile-field">
            <span>Current password</span>
            <input id="currentPasswordInput" type="password" autocomplete="current-password">
          </label>
          <label class="profile-field">
            <span>New password</span>
            <input id="newPasswordInput" type="password" autocomplete="new-password">
          </label>
          <label class="profile-field">
            <span>Confirm new password</span>
            <input id="confirmPasswordInput" type="password" autocomplete="new-password">
          </label>
          <div class="profile-actions">
            <button id="togglePasswordButton" type="button" class="secondary-button">Show passwords</button>
            <button id="changePasswordButton" type="button">Change password</button>
          </div>
        </article>

        <article class="profile-card profile-card--danger">
          <h2>Account</h2>
          <p class="profile-help">Delete this account and all saved data from the server.</p>
          <div class="profile-actions">
            <button id="deleteAccountButton" type="button" class="danger-button">Delete account</button>
          </div>
        </article>
      </section>
    </main>

    <script src="/profile.js" type="module"></script>
  </body>
</html>
